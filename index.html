<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Задачи — Assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --border: #e3e3e6;
    --accent: #0a84ff;
    --danger: #ff453a;
    --col-bg: #ececef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --text: #f2f2f7;
      --muted: #9a9a9e;
      --border: #3a3a3c;
      --col-bg: #242426;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 12px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .view { display: none; }
  .view.active { display: block; }

  .task-list {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .task-row .tags-cell {
    flex: none;
    width: 180px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: flex-end;
    align-items: center;
    cursor: pointer;
    position: relative;
  }
  .tags-cell .tags-placeholder {
    color: var(--muted);
    font-size: 12px;
    border: 1px dashed var(--border);
    border-radius: 999px;
    padding: 1px 8px;
    opacity: 0;
  }
  .task-row:hover .tags-placeholder { opacity: 1; }
  .tags-menu {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    z-index: 50;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    min-width: 180px;
    max-height: 240px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    cursor: default;
  }
  .tags-menu label {
    display: flex;
    gap: 6px;
    align-items: center;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    margin: 0;
  }
  .tags-menu .new-tag-row { display: flex; gap: 4px; margin-top: 2px; }
  .tags-menu .new-tag-row input {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: inherit;
  }
  .tags-menu .new-tag-row button {
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    background: none;
    border-radius: 6px;
    cursor: pointer;
    color: var(--accent);
  }
  .tag-pill {
    display: inline-block;
    color: var(--accent);
    font-size: 12px;
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 1px 8px;
    white-space: nowrap;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    vertical-align: middle;
    opacity: 0.85;
  }
  .card .card-meta .tag-pill { font-size: 11px; }
  .task-row .meeting-pill {
    display: inline-block;
    color: var(--muted);
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 8px;
    white-space: nowrap;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    vertical-align: middle;
  }
  .task-row {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .task-row:last-child { border-bottom: none; }
  .task-row .time {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }
  .task-row .text { flex: 1; }
  .status-done .text { text-decoration: line-through; color: var(--muted); }
  .del-btn {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 4px;
  }
  .del-btn:hover { color: var(--danger); }
  .task-row .text, .card .card-text { cursor: pointer; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 16px; margin: 0 0 14px; }
  .modal label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 12px 0 4px;
  }
  .modal textarea, .modal select {
    width: 100%;
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .modal textarea { resize: vertical; min-height: 44px; }
  .modal .meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 12px;
    line-height: 1.6;
  }
  .modal .meta a { color: var(--accent); }
  .modal .actions {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 18px;
  }
  .modal button {
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .modal .save-btn { background: var(--accent); color: #fff; }
  .modal .close-btn { background: var(--col-bg); color: var(--text); }
  .modal .delete-btn { background: none; color: var(--danger); }

  .group-title {
    font-weight: 600;
    font-size: 14px;
    color: var(--muted);
    margin: 18px 4px 8px;
  }
  .empty, .loading, .error {
    color: var(--muted);
    padding: 24px 4px;
    text-align: center;
  }
  .error { color: var(--danger); }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 700px) {
    .board { grid-template-columns: 1fr; }
  }
  .column {
    background: var(--col-bg);
    border-radius: 12px;
    padding: 10px;
    min-height: 120px;
  }
  .column-title {
    font-weight: 600;
    font-size: 14px;
    padding: 4px 6px 10px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    font-size: 14px;
    cursor: grab;
    display: flex;
    gap: 6px;
    align-items: flex-start;
  }
  .card.dragging { opacity: 0.4; }
  .card .card-text { flex: 1; }
  .card .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    color: var(--muted);
    font-size: 11px;
  }
  .card .card-meta .meeting-pill {
    display: inline-block;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 8px;
    white-space: nowrap;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .column.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; }

  .add-task-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #view-board .add-task-btn { margin: 0 0 12px; }
  .show-more-btn {
    display: block;
    width: 100%;
    border: none;
    background: none;
    color: var(--accent);
    font-size: 13px;
    padding: 10px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Задачи</h1>
  <div class="tabs">
    <button class="tab-btn active" data-view="list">Список</button>
    <button class="tab-btn" data-view="board">Канбан</button>
  </div>

  <div id="view-list" class="view active">
    <div id="content" class="loading">Загрузка…</div>
    <button class="add-task-btn">+ Добавить задачу</button>
  </div>

  <div id="view-board" class="view">
    <button class="add-task-btn">+ Добавить задачу</button>
    <div id="board" class="board"></div>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <h2 id="modal-title">Задача</h2>
      <label for="modal-text">Название работы</label>
      <textarea id="modal-text"></textarea>

      <label for="modal-status">Статус</label>
      <select id="modal-status">
        <option value="open">Открыта</option>
        <option value="in_progress">В работе</option>
        <option value="done">Готово</option>
      </select>

      <label for="modal-tags">Теги (через запятую)</label>
      <input id="modal-tags" list="tags-suggest" placeholder="Например: СБ3, КЛАД">
      <datalist id="tags-suggest"></datalist>

      <div id="modal-meta" class="meta"></div>

      <div class="actions">
        <button class="delete-btn" id="modal-delete">Удалить</button>
        <div style="display:flex; gap:8px;">
          <button class="close-btn" id="modal-close">Отмена</button>
          <button class="save-btn" id="modal-save">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

<script>
const API_BASE = "https://hub.xn--80aamvb5b.team/webhook";
const STATUS_LABELS = { open: "Открыта", in_progress: "В работе", done: "Готово" };
const STATUS_ORDER = ["open", "in_progress", "done"];

function getToken() {
  const params = new URLSearchParams(window.location.search);
  return params.get("t") || "";
}
const TOKEN = getToken();

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("ru-RU", {
    timeZone: "Europe/Moscow",
    day: "2-digit", month: "2-digit", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  });
}

function formatTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("ru-RU", {
    timeZone: "Europe/Moscow",
    hour: "2-digit", minute: "2-digit"
  });
}

function parseTags(str) {
  if (!str) return [];
  const seen = new Set();
  return String(str).split(",").map((x) => x.trim()).filter((x) => x && !seen.has(x.toLowerCase()) && seen.add(x.toLowerCase()));
}

function appendTagPills(el, t) {
  for (const tag of parseTags(t.tags)) {
    const pill = document.createElement("span");
    pill.className = "tag-pill";
    pill.textContent = tag;
    el.appendChild(pill);
  }
}

function allTags() {
  const set = new Set();
  for (const t of tasksCache) for (const tag of parseTags(t.tags)) set.add(tag);
  return [...set].sort((a, b) => a.localeCompare(b, "ru"));
}

let openTagsMenuEl = null;
function closeTagsMenu() {
  if (openTagsMenuEl) { openTagsMenuEl.remove(); openTagsMenuEl = null; }
}
document.addEventListener("click", closeTagsMenu);

function saveTags(task, tagsArr) {
  task.tags = tagsArr.join(", ");
  fetch(`${API_BASE}/assistant-tasks-tags?t=${encodeURIComponent(TOKEN)}&id=${task.id}&tags=${encodeURIComponent(task.tags)}`);
}

function drawPills(cell, task) {
  const wrap = cell.querySelector(".pills-wrap");
  wrap.innerHTML = "";
  const tags = parseTags(task.tags);
  if (!tags.length) {
    const ph = document.createElement("span");
    ph.className = "tags-placeholder";
    ph.textContent = "+ тег";
    wrap.appendChild(ph);
    return;
  }
  for (const tag of tags) {
    const pill = document.createElement("span");
    pill.className = "tag-pill";
    pill.textContent = tag;
    wrap.appendChild(pill);
  }
}

function buildTagsMenu(task, cell) {
  closeTagsMenu();
  const menu = document.createElement("div");
  menu.className = "tags-menu";
  const current = new Set(parseTags(task.tags));
  const tags = allTags();
  for (const tag of tags) {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = current.has(tag);
    cb.addEventListener("change", () => {
      const set = new Set(parseTags(task.tags));
      if (cb.checked) set.add(tag); else set.delete(tag);
      saveTags(task, [...set]);
      drawPills(cell, task);
      renderBoard(tasksCache);
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(tag));
    menu.appendChild(label);
  }
  const newRow = document.createElement("div");
  newRow.className = "new-tag-row";
  const inp = document.createElement("input");
  inp.placeholder = tags.length ? "Новый тег" : "Первый тег";
  const btn = document.createElement("button");
  btn.textContent = "+";
  btn.title = "Добавить тег";
  const addNew = () => {
    const v = inp.value.trim();
    if (!v) return;
    const set = new Set(parseTags(task.tags));
    set.add(v);
    saveTags(task, [...set]);
    drawPills(cell, task);
    renderBoard(tasksCache);
    buildTagsMenu(task, cell);
  };
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") addNew(); });
  btn.addEventListener("click", addNew);
  newRow.appendChild(inp);
  newRow.appendChild(btn);
  menu.appendChild(newRow);
  cell.appendChild(menu);
  openTagsMenuEl = menu;
  inp.focus();
}

function buildTagsCell(task) {
  const cell = document.createElement("span");
  cell.className = "tags-cell";
  const wrap = document.createElement("span");
  wrap.className = "pills-wrap";
  wrap.style.display = "contents";
  cell.appendChild(wrap);
  drawPills(cell, task);
  cell.title = "Теги задачи — нажмите, чтобы выбрать";
  cell.addEventListener("click", (e) => {
    e.stopPropagation();
    if (e.target.closest(".tags-menu")) return;
    if (openTagsMenuEl && cell.contains(openTagsMenuEl)) closeTagsMenu();
    else buildTagsMenu(task, cell);
  });
  return cell;
}

function refreshTagSuggest() {
  const dl = document.getElementById("tags-suggest");
  dl.innerHTML = "";
  for (const tag of allTags()) {
    const opt = document.createElement("option");
    opt.value = tag;
    dl.appendChild(opt);
  }
}

let tasksCache = [];
const DONE_VISIBLE = 10;
let doneExpanded = false;

function byNewest(a, b) {
  const ta = a.created_at ? new Date(a.created_at).getTime() : 0;
  const tb = b.created_at ? new Date(b.created_at).getTime() : 0;
  return tb - ta || (b.id || 0) - (a.id || 0);
}

function buildDoneToggle(hiddenCount) {
  const btn = document.createElement("button");
  btn.className = "show-more-btn";
  btn.textContent = doneExpanded ? "Свернуть" : `Показать ещё ${hiddenCount}`;
  btn.addEventListener("click", () => {
    doneExpanded = !doneExpanded;
    renderList(tasksCache);
    renderBoard(tasksCache);
  });
  return btn;
}

async function loadTasks() {
  const content = document.getElementById("content");
  if (!TOKEN) {
    content.className = "error";
    content.textContent = "Нет токена доступа в ссылке (?t=...).";
    return;
  }
  try {
    const res = await fetch(`${API_BASE}/assistant-tasks?t=${encodeURIComponent(TOKEN)}`);
    if (!res.ok) {
      content.className = "error";
      content.textContent = res.status === 403
        ? "Неверный токен доступа."
        : `Ошибка загрузки (${res.status}).`;
      return;
    }
    tasksCache = await res.json();
    renderList(tasksCache);
    renderBoard(tasksCache);
  } catch (e) {
    content.className = "error";
    content.textContent = "Не удалось связаться с сервером.";
  }
}

async function deleteTask(id) {
  if (!confirm("Удалить задачу без возможности восстановить?")) return;
  await fetch(`${API_BASE}/assistant-tasks-delete?t=${encodeURIComponent(TOKEN)}&id=${id}`);
  tasksCache = tasksCache.filter((t) => t.id !== id);
  renderList(tasksCache);
  renderBoard(tasksCache);
}

let modalTaskId = null;
let modalIsNew = false;

function openTaskModal(id) {
  const task = tasksCache.find((t) => t.id === id);
  if (!task) return;
  modalTaskId = id;
  modalIsNew = false;

  document.getElementById("modal-title").textContent = "Задача";
  document.getElementById("modal-delete").style.display = "";
  document.getElementById("modal-text").value = task.text || "";
  document.getElementById("modal-status").value = task.status || "open";
  document.getElementById("modal-tags").value = parseTags(task.tags).join(", ");
  refreshTagSuggest();

  const meta = document.getElementById("modal-meta");
  meta.innerHTML = "";
  const lines = [];
  lines.push(`Создана: ${formatDate(task.created_at)}`);
  if (task.meeting_name) lines.push(`Совещание: ${task.meeting_name} (${formatDate(task.meeting_date)})`);
  if (task.done_at) lines.push(`Выполнена: ${formatDate(task.done_at)}`);
  for (const line of lines) {
    const div = document.createElement("div");
    div.textContent = line;
    meta.appendChild(div);
  }

  document.getElementById("modal-overlay").classList.add("open");
}

function openNewTaskModal() {
  modalTaskId = null;
  modalIsNew = true;

  document.getElementById("modal-title").textContent = "Новая задача";
  document.getElementById("modal-delete").style.display = "none";
  document.getElementById("modal-text").value = "";
  document.getElementById("modal-status").value = "open";
  document.getElementById("modal-tags").value = "";
  refreshTagSuggest();
  document.getElementById("modal-meta").innerHTML = "";

  document.getElementById("modal-overlay").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
  modalTaskId = null;
}

async function saveModal() {
  const newText = document.getElementById("modal-text").value.trim();
  const newStatus = document.getElementById("modal-status").value;
  const newTags = parseTags(document.getElementById("modal-tags").value).join(", ");

  if (modalIsNew) {
    if (!newText) return closeModal();
    closeModal();
    const res = await fetch(`${API_BASE}/assistant-tasks-create?t=${encodeURIComponent(TOKEN)}&text=${encodeURIComponent(newText)}`);
    const [created] = await res.json();
    if (!created) return;
    tasksCache.unshift(created);
    if (newStatus !== "open") {
      await fetch(`${API_BASE}/assistant-tasks-status?t=${encodeURIComponent(TOKEN)}&id=${created.id}&status=${newStatus}`);
      created.status = newStatus;
    }
    if (newTags) {
      await fetch(`${API_BASE}/assistant-tasks-tags?t=${encodeURIComponent(TOKEN)}&id=${created.id}&tags=${encodeURIComponent(newTags)}`);
      created.tags = newTags;
    }
    renderList(tasksCache);
    renderBoard(tasksCache);
    return;
  }

  const id = modalTaskId;
  const task = tasksCache.find((t) => t.id === id);
  if (!task) return closeModal();

  const requests = [];
  if (newText && newText !== task.text) {
    requests.push(fetch(`${API_BASE}/assistant-tasks-edit?t=${encodeURIComponent(TOKEN)}&id=${id}&text=${encodeURIComponent(newText)}`));
    task.text = newText;
  }
  if (newStatus !== task.status) {
    requests.push(fetch(`${API_BASE}/assistant-tasks-status?t=${encodeURIComponent(TOKEN)}&id=${id}&status=${newStatus}`));
    task.status = newStatus;
  }
  if (newTags !== parseTags(task.tags).join(", ")) {
    requests.push(fetch(`${API_BASE}/assistant-tasks-tags?t=${encodeURIComponent(TOKEN)}&id=${id}&tags=${encodeURIComponent(newTags)}`));
    task.tags = newTags;
  }

  closeModal();
  renderList(tasksCache);
  renderBoard(tasksCache);
  await Promise.all(requests);
}

document.querySelectorAll(".add-task-btn").forEach((btn) => btn.addEventListener("click", openNewTaskModal));
document.getElementById("modal-save").addEventListener("click", saveModal);
document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") closeModal();
});
document.getElementById("modal-delete").addEventListener("click", async () => {
  const id = modalTaskId;
  closeModal();
  if (id != null) await deleteTask(id);
});

async function setStatus(id, status) {
  const task = tasksCache.find((t) => t.id === id);
  if (task) task.status = status;
  renderList(tasksCache);
  renderBoard(tasksCache);
  await fetch(`${API_BASE}/assistant-tasks-status?t=${encodeURIComponent(TOKEN)}&id=${id}&status=${status}`);
}

function renderList(tasks) {
  const content = document.getElementById("content");
  if (!tasks.length) {
    content.className = "empty";
    content.textContent = "Задач пока нет.";
    return;
  }

  const sorted = [...tasks].sort(byNewest);

  content.className = "";
  content.innerHTML = "";

  const buildRows = (items) => {
    const list = document.createElement("div");
    list.className = "task-list";
    for (const t of items) {
      const row = document.createElement("div");
      row.className = "task-row" + (t.status === "done" ? " status-done" : "");
      const time = document.createElement("span");
      time.className = "time";
      time.textContent = formatDate(t.created_at);
      const textWrap = document.createElement("span");
      textWrap.className = "text";
      textWrap.textContent = t.text;
      textWrap.title = "Открыть задачу";
      textWrap.addEventListener("click", () => openTaskModal(t.id));
      row.appendChild(time);
      row.appendChild(textWrap);
      if (t.meeting_name) {
        const pill = document.createElement("span");
        pill.className = "meeting-pill";
        pill.textContent = t.meeting_name;
        pill.title = "Совещание: " + t.meeting_name + (t.meeting_date ? " (" + formatDate(t.meeting_date) + ")" : "");
        row.appendChild(pill);
      }
      row.appendChild(buildTagsCell(t));
      const del = document.createElement("button");
      del.className = "del-btn";
      del.textContent = "✕";
      del.title = "Удалить";
      del.addEventListener("click", (e) => { e.stopPropagation(); deleteTask(t.id); });
      row.appendChild(del);
      list.appendChild(row);
    }
    return list;
  };

  const active = sorted.filter((t) => t.status !== "done");
  const done = sorted.filter((t) => t.status === "done");

  if (active.length) content.appendChild(buildRows(active));
  if (done.length) {
    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = "Готовые";
    content.appendChild(title);
    const visible = doneExpanded ? done : done.slice(0, DONE_VISIBLE);
    content.appendChild(buildRows(visible));
    if (done.length > DONE_VISIBLE) content.appendChild(buildDoneToggle(done.length - DONE_VISIBLE));
  }
}

function renderBoard(tasks) {
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (const status of STATUS_ORDER) {
    const column = document.createElement("div");
    column.className = "column";
    column.dataset.status = status;

    const title = document.createElement("div");
    title.className = "column-title";
    title.textContent = STATUS_LABELS[status];
    column.appendChild(title);

    let columnTasks = tasks.filter((x) => x.status === status);
    let hiddenDone = 0;
    if (status === "done") {
      columnTasks = [...columnTasks].sort(byNewest);
      if (!doneExpanded && columnTasks.length > DONE_VISIBLE) {
        hiddenDone = columnTasks.length - DONE_VISIBLE;
        columnTasks = columnTasks.slice(0, DONE_VISIBLE);
      }
    }
    for (const t of columnTasks) {
      const card = document.createElement("div");
      card.className = "card";
      card.draggable = true;
      card.dataset.id = t.id;

      const textWrap = document.createElement("div");
      textWrap.className = "card-text";
      textWrap.textContent = t.text;
      textWrap.title = "Открыть задачу";
      textWrap.addEventListener("click", () => openTaskModal(t.id));
      const meta = document.createElement("div");
      meta.className = "card-meta";
      const when = document.createElement("span");
      when.textContent = formatDate(t.created_at);
      meta.appendChild(when);
      appendTagPills(meta, t);
      if (t.meeting_name) {
        const pill = document.createElement("span");
        pill.className = "meeting-pill";
        pill.textContent = t.meeting_name;
        pill.title = "Совещание: " + t.meeting_name + (t.meeting_date ? " (" + formatDate(t.meeting_date) + ")" : "");
        meta.appendChild(pill);
      }
      textWrap.appendChild(meta);

      const del = document.createElement("button");
      del.className = "del-btn";
      del.textContent = "✕";
      del.title = "Удалить";
      del.addEventListener("click", (e) => { e.stopPropagation(); deleteTask(t.id); });

      card.appendChild(textWrap);
      card.appendChild(del);

      card.addEventListener("dragstart", () => {
        card.classList.add("dragging");
        card.dataset.dragging = "1";
      });
      card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
      });

      column.appendChild(card);
    }

    if (status === "done" && (hiddenDone > 0 || (doneExpanded && columnTasks.length > DONE_VISIBLE))) {
      column.appendChild(buildDoneToggle(hiddenDone));
    }

    column.addEventListener("dragover", (e) => {
      e.preventDefault();
      column.classList.add("drag-over");
    });
    column.addEventListener("dragleave", () => {
      column.classList.remove("drag-over");
    });
    column.addEventListener("drop", (e) => {
      e.preventDefault();
      column.classList.remove("drag-over");
      const dragging = board.querySelector(".card.dragging");
      if (!dragging) return;
      const id = Number(dragging.dataset.id);
      setStatus(id, status);
    });

    board.appendChild(column);
  }
}

document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`view-${btn.dataset.view}`).classList.add("active");
  });
});

loadTasks();
</script>
</body>
